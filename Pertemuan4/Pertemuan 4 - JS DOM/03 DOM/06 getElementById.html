<!DOCTYPE html>
<html>
<head>
    <title>getElementById</title>
</head>
<body>
    <p id="message">A paragraph</p>
    
    <script>
        const p = document.getElementById('message');
        console.log(p); // <p id="message">A paragraph</p>
        p.style.color = 'blue'; // Mengubah warna teks menjadi biru
    </script>
</body>
</html>
