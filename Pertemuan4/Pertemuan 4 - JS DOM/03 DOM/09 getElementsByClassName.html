<!DOCTYPE html>
<html>
<head>
    <title>getElementsByClassName</title>
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <ul id="menu">
                    <li class="item">HTML</li>
                    <li class="item">CSS</li>
                    <li class="item highlight">JavaScript</li>
                    <li class="item">TypeScript</li>
                </ul>
            </nav>
            <h1>getElementsByClassName Demo</h1>
        </header>
        <section>
            <article>
                <h2 class="heading-secondary">Example 1</h2>
            </article>
            <article>
                <h2 class="heading-secondary">Example 2</h2>
            </article>
        </section>
    </div>
    
    <script>
        let menu = document.getElementById('menu');
        let items = menu.getElementsByClassName('item');
        
        // Convert HTMLCollection to array and map to text content
        let data1 = Array.from(items).map(item => item.textContent);
        console.log(data1);
        
        let elements = document.getElementsByClassName('heading-secondary');
        let data2 = Array.from(elements).map(elem => elem.textContent);
        console.log(data2);
    </script>
</body>
</html>
