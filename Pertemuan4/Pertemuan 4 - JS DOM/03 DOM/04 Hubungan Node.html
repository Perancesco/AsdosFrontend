<!DOCTYPE html>
<html>
<head>
    <title>Hubungan Antar Node</title>
</head>
<body>
    <div id="parent">
        <h1>Judul</h1>
        <p>Paragraf pertama</p>
        <p>Paragraf kedua</p>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const parent = document.querySelector('#parent');
            
            // Parent node
            console.log('Parent of h1:', document.querySelector('h1').parentNode.id);
            
            // Child nodes
            console.log('Children of parent:', parent.children);
            
            // First child
            console.log('First child:', parent.firstElementChild.nodeName);
            
            // Last child
            console.log('Last child:', parent.lastElementChild.nodeName);
            
            // Siblings
            const firstP = document.querySelector('p');
            console.log('Next sibling:', firstP.nextElementSibling.nodeName);
        });
    </script>
</body>
</html>
